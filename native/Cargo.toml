[package]
name = "sawbyte-play"
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false, features = ["online-mode"] }
sawbyte-core = { path = "../crates/sawbyte-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
