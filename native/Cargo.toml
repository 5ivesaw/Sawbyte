[package]
name = "sawbyte-play"
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
sawbyte-core = { path = "../crates/sawbyte-core" }
sawbyte-protocol = { path = "../crates/sawbyte-protocol" }
flate2 = "1.1"
serde_json = "1.0"
md-5 = "0.10"
aes = "0.8"
cfb8 = "0.8"
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
