[package]
name = "sawbyte-play"
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
azalea = { git = "https://github.com/5ivesaw/sawbyte-azalea", rev = "abe71b291ebdf9365de1a8343be396cc1f647ab3", default-features = false, features = ["online-mode"] }
sawbyte-core = { path = "../crates/sawbyte-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
