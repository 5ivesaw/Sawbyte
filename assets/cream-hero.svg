<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%">
  <defs>
    <linearGradient id="creamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="55%" stop-color="#F5EFE2" />
      <stop offset="100%" stop-color="#EDE3D0" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C47A2C" />
      <stop offset="50%" stop-color="#2B6E5B" />
      <stop offset="100%" stop-color="#8C5230" />
    </linearGradient>
  </defs>

  <!-- Outer Cream Frame -->
  <rect x="2" y="2" width="956" height="276" rx="18" fill="url(#creamBg)" stroke="#D8CBB5" stroke-width="2" />
  <rect x="2" y="2" width="956" height="8" rx="4" fill="url(#accentBar)" />

  <!-- Decorative Grid Lines -->
  <line x1="36" y1="205" x2="924" y2="205" stroke="#E2D6C1" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="44" y="68" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#1F1D1A" letter-spacing="-0.8">SAWBYTE</text>
  <rect x="242" y="42" width="116" height="28" rx="14" fill="#EAE0CE" stroke="#C47A2C" stroke-width="1.2" />
  <text x="300" y="61" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#8C5230">v0.2.1 · 26.3</text>

  <text x="44" y="106" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#3D372E">
    Experimental native client and automation foundation.
  </text>
  <text x="44" y="138" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#5C5346">
    Independent Rust client · Minecraft Java 26.3 prototype · Optional reference bridge
  </text>
  <text x="44" y="162" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#5C5346">
    General automation, reliable outcomes and a real launcher remain in development
  </text>

  <!-- Cream Feature Pills at Bottom -->
  <g transform="translate(44, 222)">
    <rect x="0" y="0" width="198" height="36" rx="10" fill="#FDFBF7" stroke="#D5C7B0" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#2B6E5B" />
    <text x="34" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1F1D1A">~5 MiB Fixture RSS</text>

    <rect x="212" y="0" width="222" height="36" rx="10" fill="#FDFBF7" stroke="#D5C7B0" stroke-width="1.2" />
    <circle cx="232" cy="18" r="5" fill="#C47A2C" />
    <text x="246" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1F1D1A">3.41e-7 Block Parity</text>

    <rect x="448" y="0" width="206" height="36" rx="10" fill="#FDFBF7" stroke="#D5C7B0" stroke-width="1.2" />
    <circle cx="468" cy="18" r="5" fill="#2B6E5B" />
    <text x="482" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1F1D1A">MCP In Development</text>

    <rect x="668" y="0" width="204" height="36" rx="10" fill="#FDFBF7" stroke="#D5C7B0" stroke-width="1.2" />
    <circle cx="688" cy="18" r="5" fill="#8C5230" />
    <text x="702" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1F1D1A">Linux · Windows · macOS builds</text>
  </g>
