[workspace]
members = ["crates/sawbyte-core", "crates/sawbyte-protocol", "crates/sawbyte-cli"]
resolver = "2"
exclude = ["native"]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/5ivesaw/Sawbyte"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

