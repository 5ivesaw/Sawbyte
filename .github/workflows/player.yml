name: Real player milestone
on:
  push:
    branches: [feat/real-player, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparison:
    needs: [native, bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sawbyte-play-linux-x64
          path: run/bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sawbyte-bridge-26.3
          path: run/mods
      - name: Prepare fixture generator and virtual display
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          python3 tools/fix_rust_edition_and_let_chains.py
          cargo build --release || cargo build --release --offline
          chmod +x run/bin/sawbyte-play
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers x11-xserver-utils
      - name: Compare real players
        run: |
          BRIDGE_JAR=$(ls run/mods/sawbyte-bridge-*.jar | grep -vE '(-dev|-sources)\.jar' | head -n 1)
          python tools/player_lab.py --native run/bin/sawbyte-play --cli target/release/sawbyte --bridge "$BRIDGE_JAR"
      - name: Run crucible benchmark
        run: |
          BRIDGE_JAR=$(ls run/mods/sawbyte-bridge-*.jar | grep -vE '(-dev|-sources)\.jar' | head -n 1)
          python tools/crucible_bench.py --backend both --native run/bin/sawbyte-play --cli target/release/sawbyte --bridge "$BRIDGE_JAR"
      - name: Run universal capabilities & 16-server benchmarks
        run: |
          python tools/universal_bench.py --target harness --native-bin run/bin/sawbyte-play
          python benchmarks/run_all_16_servers.py --mode auto
      - name: Upload evidence (no game binaries or credentials)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: player-comparison-evidence
          path: run/reports/
          if-no-files-found: warn
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef
        with:
          gradle-version: '9.8.2'
          cache-read-only: false
      - name: Build normal-client bridge
        working-directory: bridge
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sawbyte-bridge-26.3
          path: bridge/build/libs/*.jar
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ matrix.platform }}-${{ hashFiles('native/Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-${{ matrix.platform }}-${{ hashFiles('native/Cargo.lock') }}-
      - name: Install backend toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/branding
      - name: Verify Rust edition and lockfile consistency
        run: python tools/fix_rust_edition_and_let_chains.py
      - name: Resolve backend lockfile in CI
        working-directory: native
        run: |
          if [ -f Cargo.lock ]; then cargo fetch --locked || cargo fetch; else cargo generate-lockfile; fi
          cargo fmt --all
      - name: Review generated source changes
        if: always()
        run: git diff > native-formatting.patch
      - name: Upload generated lock and format patch
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-generated-${{ matrix.platform }}
          path: |
            native/Cargo.lock
            native-formatting.patch
      - name: Build and check standalone player
        working-directory: native
        run: |
          cargo clippy --locked --all-targets || cargo clippy --all-targets
          cargo test --locked || cargo test
          cargo build --release --locked || cargo build --release
          ./target/release/sawbyte-play --help
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ matrix.platform }}-${{ hashFiles('native/Cargo.lock') }}-${{ github.sha }}
      - name: Package standalone player
        run: |
          mkdir -p run/player
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp native/target/release/sawbyte-play.exe run/player/
          else
            cp native/target/release/sawbyte-play run/player/
            chmod +x run/player/sawbyte-play
          fi
          cp README.md LICENSE docs/COVERAGE.md assets/sawbyte.png run/player/
          cp docs/PLAYER.md run/player/
          cp packaging/generated/sawbyte.ico packaging/generated/sawbyte.icns run/player/
          if [ -f run/reports/block-profile.json ]; then
            cp run/reports/block-profile.json run/player/block-profile.json
          elif [ -f block-profile.json ]; then
            cp block-profile.json run/player/block-profile.json
          else
            python - <<'PY'
          import json, pathlib
          profile = {
              "minecraft": "26.3",
              "air": [0],
              "solid": [1],
              "bottom_slabs": [],
              "top_slabs": [],
              "stairs": [],
              "fences": [],
              "carpets": [],
              "climbable": [],
              "water": [],
              "lava": [],
              "cobwebs": [],
              "soul_sand": [],
              "ice": [],
              "hardness": {"1": 1.5}
          }
          pathlib.Path("run/player/block-profile.json").write_text(json.dumps(profile, indent=2) + "\n")
          PY
          fi
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('run/player')
          (root / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n'
              for p in sorted(root.iterdir()) if p.is_file()
          ))
          PY
      - name: Upload player
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sawbyte-play-${{ matrix.platform }}
          path: run/player/
          if-no-files-found: error

  release:
    name: Publish player & bridge release assets
    needs: [comparison, bridge, native]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download all player artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-artifacts
      - name: Package player release archives
        shell: bash
        run: |
          mkdir -p release-assets
          BRIDGE_MAIN=$(find release-artifacts/sawbyte-bridge-26.3 -type f -name "sawbyte-bridge-*.jar" | grep -vE '(-dev|-sources)\.jar' | head -n 1 || true)
          if [ -n "$BRIDGE_MAIN" ] && [ -f "$BRIDGE_MAIN" ]; then
            cp "$BRIDGE_MAIN" release-assets/
            cp "$BRIDGE_MAIN" release-assets/sawbyte-bridge-0.5.1.jar 2>/dev/null || true
            cp "$BRIDGE_MAIN" release-assets/sawbyte-bridge-0.3.4.jar 2>/dev/null || true
            cp "$BRIDGE_MAIN" release-assets/sawbyte-bridge-26.3.jar
          fi
          if [ -f release-artifacts/player-comparison-evidence/block-profile.json ]; then
            cp release-artifacts/player-comparison-evidence/block-profile.json release-assets/block-profile.json
            for dir in release-artifacts/sawbyte-play-*; do
              if [ -d "$dir" ]; then
                cp release-artifacts/player-comparison-evidence/block-profile.json "$dir/block-profile.json"
              fi
            done
          fi
          for dir in release-artifacts/sawbyte-play-*; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              if [ -f "$dir/sawbyte-play" ]; then
                chmod +x "$dir/sawbyte-play"
              fi
              if [[ "$name" == *"windows"* ]]; then
                (cd "$dir" && zip -qr "../../release-assets/${name}.zip" .)
              else
                tar -czf "release-assets/${name}.tar.gz" -C "$dir" .
              fi
            fi
          done
          cd release-assets
          sha256sum * > SHA256SUMS-sawbyte-play.txt
          ls -lh
      - name: Publish or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v0.5.1"
          fi
          echo "Publishing player assets for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --draft=false --latest || true
          else
            gh release create "$TAG" release-assets/* \
              --title "Sawbyte $TAG" \
              --draft=false \
              --latest \
              --generate-notes || (gh release upload "$TAG" release-assets/* --clobber && gh release edit "$TAG" --draft=false --latest)
          fi
