name: 16-Server Cracked Benchmarks & Auto-Update Docs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - 'tools/update_benchmarks_docs.py'

permissions:
  contents: write

jobs:
  cracked-benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/branding
      - name: Build Sawbyte CLI & Native Headless Client
        run: |
          python3 tools/fix_rust_edition_and_let_chains.py
          cargo build --workspace --release
          if [ ! -f native/Cargo.lock ] || ! cargo fetch --manifest-path native/Cargo.toml --locked; then
            rm -f native/Cargo.lock
            cargo generate-lockfile --manifest-path native/Cargo.toml
            cargo fetch --manifest-path native/Cargo.toml --locked
          fi
          cargo build --release --manifest-path native/Cargo.toml --locked
      - name: Run All 16 Cracked Server Benchmarks & Update README + Website
        run: |
          python3 benchmarks/run_all_16_servers.py --mode auto --update-docs
      - name: Upload 16-Server Benchmark Report & Sensory Vision Logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cracked-servers-benchmark-report
          path: |
            run/reports/cracked_servers_benchmark.json
            run/reports/sensory_vision_samples.txt
      - name: Commit & Push Updated README.md and Website Benchmarks
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/BENCHMARKS.md docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(benchmarks): auto-update 16-server cracked benchmark results in README and website"
            git push
          fi
