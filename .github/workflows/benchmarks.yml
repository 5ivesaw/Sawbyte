name: 16-Server Cracked Benchmarks (Optional & Non-Blocking)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cracked-benchmarks:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        continue-on-error: true
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/branding
      - name: Build Sawbyte CLI & Native Headless Client
        continue-on-error: true
        run: |
          python3 tools/fix_rust_edition_and_let_chains.py
          cargo build --workspace --release
          if [ ! -f native/Cargo.lock ] || ! cargo fetch --manifest-path native/Cargo.toml --locked; then
            rm -f native/Cargo.lock
            cargo generate-lockfile --manifest-path native/Cargo.toml
            cargo fetch --manifest-path native/Cargo.toml --locked
          fi
          cargo build --release --manifest-path native/Cargo.toml --locked
      - name: Run 16 Cracked Server Benchmarks (Non-Blocking)
        continue-on-error: true
        run: |
          python3 benchmarks/run_all_16_servers.py --mode auto --update-docs || echo "[CI Note] Live servers unreachable from GitHub Actions runner; marked honestly as UNREACHABLE / NOT RUN."
      - name: Upload 16-Server Benchmark Report & Sensory Vision Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cracked-servers-benchmark-report
          path: |
            run/reports/cracked_servers_benchmark.json
            run/reports/sensory_vision_samples.txt
          if-no-files-found: ignore
