name: Build and verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/branding
      - name: Format review
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --all
          git diff > formatting.patch
      - name: Upload formatting patch on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: ignore
      - name: Static analysis
        run: cargo clippy --workspace --all-targets --locked --offline
      - name: Tests
        shell: bash
        run: |
          cargo test --workspace --locked --offline
          if [ -f native/Cargo.lock ]; then
            cargo fetch --manifest-path native/Cargo.toml --locked
            cargo test --manifest-path native/Cargo.toml --locked
          fi
      - name: Build release
        shell: bash
        run: |
          cargo build --workspace --release --locked --offline
          if [ -f native/Cargo.lock ]; then
            cargo build --release --manifest-path native/Cargo.toml --locked
          fi
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/sawbyte --version
          ./target/release/sawbyte capabilities
          ./target/release/sawbyte demo
          ./target/release/sawbyte demo --direct
          ./target/release/sawbyte launcher list
          ./target/release/sawbyte launcher create smoke-bot sawbyte-26.3 native
          ./target/release/sawbyte launcher set-setting smoke-bot fov 90
          ./target/release/sawbyte launcher backup smoke-bot
          ./target/release/sawbyte launcher rollback smoke-bot 1
          ./target/release/sawbyte launcher mods list smoke-bot
          ./target/release/sawbyte install
          ./target/release/sawbyte benchmark
          SAWBYTE_BIN=./target/release/sawbyte python sdks/python/tests/test_sdk.py
          node --test sdks/typescript/test/sdk.test.mjs
          if [ "$RUNNER_OS" = "Linux" ]; then
            python tools/universal_bench.py --target harness
          fi

      - name: Package Native Desktop App & Standalone CLI
        shell: bash
        run: |
          mkdir -p dist dist-launcher
          if [ ! -f block-profile.json ] && [ ! -f run/reports/block-profile.json ]; then
            python -c 'import json, pathlib; p={"minecraft":"26.3","air":[0],"solid":[1],"bottom_slabs":[],"top_slabs":[],"stairs":[],"fences":[],"carpets":[],"climbable":[],"water":[],"lava":[],"cobwebs":[],"soul_sand":[],"ice":[],"hardness":{"1":1.5}}; pathlib.Path("block-profile.json").write_text(json.dumps(p, indent=2) + "\n")'
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/sawbyte.exe dist/sawbyte.exe
            cp target/release/sawbyte.exe dist-launcher/sawbyte-launcher.exe
            cp target/release/sawbyte.exe dist-launcher/sawbyte.exe
            cp "packaging/Sawbyte Launcher.bat" dist-launcher/
            cp packaging/install.bat dist/
            cp packaging/install.bat dist-launcher/
          else
            cp target/release/sawbyte dist/sawbyte
            cp target/release/sawbyte dist-launcher/sawbyte-launcher
            cp target/release/sawbyte dist-launcher/sawbyte
            chmod +x dist/sawbyte dist-launcher/sawbyte-launcher dist-launcher/sawbyte
            cp packaging/sawbyte.desktop dist-launcher/
            cp packaging/install.sh dist/
            cp packaging/install.sh dist-launcher/
            chmod +x dist/install.sh dist-launcher/install.sh
          fi
          cp README.md LICENSE dist/
          cp README.md LICENSE dist-launcher/
          cp assets/sawbyte.png dist/sawbyte.png
          cp assets/sawbyte.png dist-launcher/sawbyte.png
          if [ -d packaging/generated ]; then
            cp packaging/generated/sawbyte.ico packaging/generated/sawbyte.icns dist/ 2>/dev/null || true
            cp packaging/generated/sawbyte.ico packaging/generated/sawbyte.icns dist-launcher/ 2>/dev/null || true
          fi
          if [ -f run/reports/block-profile.json ]; then
            cp run/reports/block-profile.json dist/block-profile.json
            cp run/reports/block-profile.json dist-launcher/block-profile.json
          elif [ -f block-profile.json ]; then
            cp block-profile.json dist/block-profile.json
            cp block-profile.json dist-launcher/block-profile.json
          fi
          python -c 'import hashlib, pathlib; [pathlib.Path(d, "SHA256SUMS").write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in sorted(pathlib.Path(d).iterdir()) if p.is_file() and p.name != "SHA256SUMS")) for d in ("dist", "dist-launcher")]'
      - name: Upload standalone CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sawbyte-${{ matrix.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone native launcher artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sawbyte-launcher-${{ matrix.os }}-${{ runner.arch }}
          path: dist-launcher/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Native App (.deb, .AppImage, .exe) & CLI Release Assets
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all preview artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-artifacts
      - name: Package .deb, .AppImage, standalone .exe, and archives
        shell: bash
        run: |
          mkdir -p release-assets
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG_VER="0.5.0"
          fi

          LINUX_LAUNCHER_DIR=$(find release-artifacts -maxdepth 1 -type d -name "sawbyte-launcher-ubuntu*" | head -n 1)
          if [ -n "$LINUX_LAUNCHER_DIR" ] && [ -f "$LINUX_LAUNCHER_DIR/sawbyte-launcher" ]; then
            chmod +x "$LINUX_LAUNCHER_DIR/sawbyte-launcher" "$LINUX_LAUNCHER_DIR/sawbyte"

            cp "$LINUX_LAUNCHER_DIR/sawbyte-launcher" "release-assets/Sawbyte-Launcher-x86_64.AppImage"
            cp "$LINUX_LAUNCHER_DIR/sawbyte-launcher" "release-assets/sawbyte-launcher-linux-x86_64"
            cp "$LINUX_LAUNCHER_DIR/sawbyte" "release-assets/sawbyte-cli-linux-x86_64"
            chmod +x "release-assets/Sawbyte-Launcher-x86_64.AppImage" "release-assets/sawbyte-launcher-linux-x86_64" "release-assets/sawbyte-cli-linux-x86_64"

            DEB_ROOT="deb-pkg/sawbyte-launcher_${TAG_VER}_amd64"
            mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications" "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps" "$DEB_ROOT/etc/sawbyte"

            cp "$LINUX_LAUNCHER_DIR/sawbyte-launcher" "$DEB_ROOT/usr/bin/sawbyte-launcher"
            cp "$LINUX_LAUNCHER_DIR/sawbyte" "$DEB_ROOT/usr/bin/sawbyte"
            chmod 0755 "$DEB_ROOT/usr/bin/sawbyte-launcher" "$DEB_ROOT/usr/bin/sawbyte"
            cp assets/sawbyte.png "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/sawbyte.png"
            if [ -f "$LINUX_LAUNCHER_DIR/block-profile.json" ]; then
              cp "$LINUX_LAUNCHER_DIR/block-profile.json" "$DEB_ROOT/etc/sawbyte/block-profile.json"
            fi

            printf "[Desktop Entry]\nType=Application\nName=Sawbyte\nComment=Sawbyte Native Minecraft 26.3 Client & Bot Launcher\nExec=/usr/bin/sawbyte-launcher\nIcon=sawbyte\nTerminal=false\nCategories=Game;Utility;\nStartupNotify=true\n" > "$DEB_ROOT/usr/share/applications/sawbyte.desktop"
            chmod 0644 "$DEB_ROOT/usr/share/applications/sawbyte.desktop"

            printf "Package: sawbyte-launcher\nVersion: %s\nSection: games\nPriority: optional\nArchitecture: amd64\nMaintainer: 5ivesaw <https://github.com/5ivesaw/Sawbyte>\nDescription: Sawbyte Native Desktop App & CLI for Minecraft 26.3\n Pure-Rust native desktop launcher and zero-JVM Minecraft 26.3 engine.\n" "$TAG_VER" > "$DEB_ROOT/DEBIAN/control"
            chmod 0755 "$DEB_ROOT/DEBIAN"
            chmod 0644 "$DEB_ROOT/DEBIAN/control"

            dpkg-deb --root-owner-group --build "$DEB_ROOT" "release-assets/sawbyte-launcher_${TAG_VER}_amd64.deb"
            cp "release-assets/sawbyte-launcher_${TAG_VER}_amd64.deb" "release-assets/sawbyte-launcher-linux-amd64.deb"
          fi

          WIN_LAUNCHER_DIR=$(find release-artifacts -maxdepth 1 -type d -name "sawbyte-launcher-windows*" | head -n 1)
          if [ -n "$WIN_LAUNCHER_DIR" ] && [ -f "$WIN_LAUNCHER_DIR/sawbyte-launcher.exe" ]; then
            cp "$WIN_LAUNCHER_DIR/sawbyte-launcher.exe" "release-assets/Sawbyte-Launcher-x64.exe"
            cp "$WIN_LAUNCHER_DIR/sawbyte.exe" "release-assets/sawbyte-cli-x64.exe"
          fi

          for dir in release-artifacts/sawbyte-*; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              find "$dir" -type f \( -name "sawbyte" -o -name "sawbyte-play" -o -name "sawbyte-launcher" -o -name "install.sh" -o -name "*.command" \) -exec chmod +x {} + 2>/dev/null || true
              if [[ "$name" == *"windows"* ]]; then
                (cd "$dir" && zip -qr "../../release-assets/${name}.zip" .)
                if [[ "$name" != *"launcher"* ]]; then
                  cli_name="${name/sawbyte-/sawbyte-cli-}"
                  cp "release-assets/${name}.zip" "release-assets/${cli_name}.zip"
                fi
              else
                tar -czf "release-assets/${name}.tar.gz" -C "$dir" .
                if [[ "$name" != *"launcher"* ]]; then
                  cli_name="${name/sawbyte-/sawbyte-cli-}"
                  cp "release-assets/${name}.tar.gz" "release-assets/${cli_name}.tar.gz"
                fi
              fi
            fi
          done
          cp packaging/install.sh release-assets/install.sh
          cp packaging/install.bat release-assets/install.bat
          cd release-assets
          sha256sum * > SHA256SUMS-sawbyte.txt
          ls -lh
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v0.5.0"
          fi
          echo "Publishing release for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --draft=false --latest || true
          else
            gh release create "$TAG" release-assets/* \
              --title "Sawbyte $TAG" \
              --draft=false \
              --latest \
              --generate-notes || (gh release upload "$TAG" release-assets/* --clobber && gh release edit "$TAG" --draft=false --latest)
          fi
