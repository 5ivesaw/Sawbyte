name: Build and verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/branding
      - name: Format review
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --all
          git diff --exit-code > formatting.patch
      - name: Upload formatting patch on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: ignore
      - name: Static analysis
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests
        shell: bash
        run: |
          cargo test --workspace --locked --offline
          if [ -f native/Cargo.lock ]; then
            cargo test --manifest-path native/Cargo.toml
          fi
      - name: Build release
        shell: bash
        run: |
          cargo build --workspace --release --locked --offline
          if [ -f native/Cargo.lock ]; then
            cargo build --release --manifest-path native/Cargo.toml
          fi
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/sawbyte --version
          ./target/release/sawbyte capabilities
          ./target/release/sawbyte demo
          ./target/release/sawbyte demo --direct
          ./target/release/sawbyte launcher list
          ./target/release/sawbyte launcher create smoke-bot sawbyte-26.3 native
          ./target/release/sawbyte launcher set-setting smoke-bot fov 90
          ./target/release/sawbyte launcher backup smoke-bot
          ./target/release/sawbyte launcher rollback smoke-bot 1
          ./target/release/sawbyte benchmark
          SAWBYTE_BIN=./target/release/sawbyte python sdks/python/tests/test_sdk.py
          node --test sdks/typescript/test/sdk.test.mjs
      - name: Package preview
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/sawbyte.exe dist/
            if [ -f native/target/release/sawbyte-play.exe ]; then
              cp native/target/release/sawbyte-play.exe dist/
            elif [ -f target/release/sawbyte-play.exe ]; then
              cp target/release/sawbyte-play.exe dist/
            fi
          else
            cp target/release/sawbyte dist/
            if [ -f native/target/release/sawbyte-play ]; then
              cp native/target/release/sawbyte-play dist/
            elif [ -f target/release/sawbyte-play ]; then
              cp target/release/sawbyte-play dist/
            fi
          fi
          cp README.md LICENSE dist/
          cp assets/sawbyte.png dist/sawbyte.png
          cp packaging/generated/sawbyte.ico packaging/generated/sawbyte.icns dist/
          if [ "$RUNNER_OS" = "Linux" ]; then cp packaging/sawbyte.desktop dist/; fi
          if [ -f run/reports/block-profile.json ]; then
            cp run/reports/block-profile.json dist/
          elif [ -f block-profile.json ]; then
            cp block-profile.json dist/
          fi
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file())
          (root / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files
          ))
          PY
      - name: Upload preview binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sawbyte-${{ matrix.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish CLI release assets
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all preview artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-artifacts
      - name: Package release archives
        shell: bash
        run: |
          mkdir -p release-assets
          for dir in release-artifacts/sawbyte-*; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              if [[ "$name" == *"windows"* ]]; then
                (cd "$dir" && zip -r "../../release-assets/${name}.zip" .)
              else
                tar -czf "release-assets/${name}.tar.gz" -C "$dir" .
              fi
            fi
          done
          cd release-assets
          sha256sum * > SHA256SUMS-sawbyte.txt
          ls -lh
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == "main" || "$TAG" == "" ]]; then
            TAG="v0.2.1"
          fi
          echo "Publishing release for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Sawbyte $TAG" \
              --generate-notes || gh release upload "$TAG" release-assets/* --clobber
          fi
