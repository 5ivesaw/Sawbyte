name: Build and verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/branding
      - name: Format review
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --all
          git diff > formatting.patch
      - name: Upload formatting patch on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: ignore
      - name: Static analysis
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests
        shell: bash
        run: |
          cargo test --workspace --locked --offline
          if [ -f native/Cargo.lock ]; then
            cargo fetch --manifest-path native/Cargo.toml --locked
            cargo test --manifest-path native/Cargo.toml --locked
          fi
      - name: Build release
        shell: bash
        run: |
          cargo build --workspace --release --locked --offline
          if [ -f native/Cargo.lock ]; then
            cargo build --release --manifest-path native/Cargo.toml --locked
          fi
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/sawbyte --version
          ./target/release/sawbyte capabilities
          ./target/release/sawbyte demo
          ./target/release/sawbyte demo --direct
          ./target/release/sawbyte launcher list
          ./target/release/sawbyte launcher create smoke-bot sawbyte-26.3 native
          ./target/release/sawbyte launcher set-setting smoke-bot fov 90
          ./target/release/sawbyte launcher backup smoke-bot
          ./target/release/sawbyte launcher rollback smoke-bot 1
          ./target/release/sawbyte launcher mods list smoke-bot
          ./target/release/sawbyte install
          ./target/release/sawbyte benchmark
          SAWBYTE_BIN=./target/release/sawbyte python sdks/python/tests/test_sdk.py
          node --test sdks/typescript/test/sdk.test.mjs
          if [ "$RUNNER_OS" = "Linux" ]; then
            python tools/universal_bench.py --target harness
          fi
      - name: Setup pnpm and Node.js
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop launcher
        shell: bash
        run: |
          cd launcher
          pnpm install --no-frozen-lockfile --ignore-scripts=false
          pnpm run build:renderer
          pnpm run build
      - name: Package preview
        shell: bash
        run: |
          mkdir -p dist dist-launcher
          if [ ! -f block-profile.json ] && [ ! -f run/reports/block-profile.json ]; then
            python - <<'PY'
          import json, pathlib
          profile = {
              "minecraft": "26.3",
              "air": [0],
              "solid": [1],
              "bottom_slabs": [],
              "top_slabs": [],
              "stairs": [],
              "fences": [],
              "carpets": [],
              "climbable": [],
              "water": [],
              "lava": [],
              "cobwebs": [],
              "soul_sand": [],
              "ice": [],
              "hardness": {"1": 1.5}
          }
          pathlib.Path("block-profile.json").write_text(json.dumps(profile, indent=2) + "\n")
          PY
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/sawbyte.exe dist/
            cp target/release/sawbyte.exe dist-launcher/
            if [ -f native/target/release/sawbyte-play.exe ]; then
              cp native/target/release/sawbyte-play.exe dist/
              cp native/target/release/sawbyte-play.exe dist-launcher/
            elif [ -f target/release/sawbyte-play.exe ]; then
              cp target/release/sawbyte-play.exe dist/
              cp target/release/sawbyte-play.exe dist-launcher/
            fi
            cp "packaging/Sawbyte Launcher.bat" dist/
            cp "packaging/Sawbyte Launcher.bat" dist-launcher/
            cp packaging/install.bat dist/
            cp packaging/install.bat dist-launcher/
            for d in launcher/dist/win-unpacked launcher/xmcl-electron-app/build/output/win-unpacked launcher/xmcl-electron-app/dist/win-unpacked; do
              if [ -d "$d" ]; then
                mkdir -p dist-launcher/launcher/dist dist-launcher/launcher/xmcl-electron-app/dist
                cp -r "$d" dist-launcher/launcher/dist/win-unpacked
                cp -r "$d" dist-launcher/launcher/xmcl-electron-app/dist/win-unpacked
                break
              fi
            done
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp target/release/sawbyte dist/
            cp target/release/sawbyte dist-launcher/
            if [ -f native/target/release/sawbyte-play ]; then
              cp native/target/release/sawbyte-play dist/
              cp native/target/release/sawbyte-play dist-launcher/
            elif [ -f target/release/sawbyte-play ]; then
              cp target/release/sawbyte-play dist/
              cp target/release/sawbyte-play dist-launcher/
            fi
            cp "packaging/Sawbyte Launcher.command" dist/
            cp "packaging/Sawbyte Launcher.command" dist-launcher/
            chmod +x "dist/Sawbyte Launcher.command" "dist-launcher/Sawbyte Launcher.command"
            cp packaging/install.sh dist/
            cp packaging/install.sh dist-launcher/
            chmod +x dist/install.sh dist-launcher/install.sh
            for d in "launcher/dist/mac-arm64/Sawbyte Launcher.app" "launcher/dist/mac/Sawbyte Launcher.app" "launcher/xmcl-electron-app/build/output/mac-arm64/Sawbyte Launcher.app" "launcher/xmcl-electron-app/build/output/mac/Sawbyte Launcher.app" "launcher/xmcl-electron-app/dist/mac/Sawbyte Launcher.app"; do
              if [ -d "$d" ]; then
                mkdir -p "dist-launcher/launcher/dist/mac" "dist-launcher/launcher/xmcl-electron-app/dist/mac"
                cp -r "$d" "dist-launcher/launcher/dist/mac/"
                cp -r "$d" "dist-launcher/launcher/xmcl-electron-app/dist/mac/"
                break
              fi
            done
          else
            cp target/release/sawbyte dist/
            cp target/release/sawbyte dist-launcher/
            if [ -f native/target/release/sawbyte-play ]; then
              cp native/target/release/sawbyte-play dist/
              cp native/target/release/sawbyte-play dist-launcher/
            elif [ -f target/release/sawbyte-play ]; then
              cp target/release/sawbyte-play dist/
              cp target/release/sawbyte-play dist-launcher/
            fi
            cp packaging/sawbyte-launcher dist/
            cp packaging/sawbyte-launcher dist-launcher/
            chmod +x dist/sawbyte-launcher dist-launcher/sawbyte-launcher
            cp packaging/sawbyte.desktop dist/
            cp packaging/sawbyte.desktop dist-launcher/
            cp packaging/install.sh dist/
            cp packaging/install.sh dist-launcher/
            chmod +x dist/install.sh dist-launcher/install.sh
            for d in launcher/dist/linux-unpacked launcher/xmcl-electron-app/build/output/linux-unpacked launcher/xmcl-electron-app/dist/linux-unpacked; do
              if [ -d "$d" ]; then
                mkdir -p dist-launcher/launcher/dist dist-launcher/launcher/xmcl-electron-app/dist
                cp -r "$d" dist-launcher/launcher/dist/linux-unpacked
                cp -r "$d" dist-launcher/launcher/xmcl-electron-app/dist/linux-unpacked
                break
              fi
            done
          fi
          cp README.md LICENSE dist/
          cp README.md LICENSE dist-launcher/
          cp assets/sawbyte.png dist/sawbyte.png
          cp assets/sawbyte.png dist-launcher/sawbyte.png
          if [ -d packaging/generated ]; then
            cp packaging/generated/sawbyte.ico packaging/generated/sawbyte.icns dist/ 2>/dev/null || true
            cp packaging/generated/sawbyte.ico packaging/generated/sawbyte.icns dist-launcher/ 2>/dev/null || true
          fi
          if [ -f run/reports/block-profile.json ]; then
            cp run/reports/block-profile.json dist/block-profile.json
            cp run/reports/block-profile.json dist-launcher/block-profile.json
          elif [ -f block-profile.json ]; then
            cp block-profile.json dist/block-profile.json
            cp block-profile.json dist-launcher/block-profile.json
          fi
          python - <<'PY'
          import hashlib, pathlib
          for folder in ['dist', 'dist-launcher']:
              root = pathlib.Path(folder)
              files = sorted(p for p in root.iterdir() if p.is_file() and p.name != 'SHA256SUMS')
              (root / 'SHA256SUMS').write_text(''.join(
                  f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files
              ))
          PY
      - name: Upload preview binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sawbyte-${{ matrix.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload launcher bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sawbyte-launcher-${{ matrix.os }}-${{ runner.arch }}
          path: dist-launcher/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish CLI & Launcher release assets
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all preview artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-artifacts
      - name: Package release archives
        shell: bash
        run: |
          mkdir -p release-assets
          for dir in release-artifacts/sawbyte-*; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              # Restore executable bits stripped by artifact upload/download
              find "$dir" -type f \( -name "sawbyte" -o -name "sawbyte-play" -o -name "sawbyte-launcher" -o -name "install.sh" -o -name "*.command" -o -name "chrome-sandbox" \) -exec chmod +x {} + 2>/dev/null || true
              find "$dir" -path "*/MacOS/*" -type f -exec chmod +x {} + 2>/dev/null || true
              if [[ "$name" == *"windows"* ]]; then
                (cd "$dir" && zip -qr "../../release-assets/${name}.zip" .)
              else
                tar -czf "release-assets/${name}.tar.gz" -C "$dir" .
              fi
            fi
          done
          cp packaging/install.sh release-assets/install.sh
          cp packaging/install.bat release-assets/install.bat
          cd release-assets
          sha256sum * > SHA256SUMS-sawbyte.txt
          ls -lh
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v0.3.3"
          fi
          echo "Publishing release for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --latest || true
          else
            gh release create "$TAG" release-assets/* \
              --title "Sawbyte $TAG" \
              --latest \
              --generate-notes || gh release upload "$TAG" release-assets/* --clobber
          fi
