name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/branding
      - name: Format review
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --all
          git diff --exit-code > formatting.patch
      - name: Upload formatting patch on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: ignore
      - name: Static analysis
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --offline
      - name: Build release
        run: cargo build --workspace --release --locked --offline
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/sawbyte --version
          ./target/release/sawbyte capabilities
          ./target/release/sawbyte demo
          ./target/release/sawbyte demo --direct
          ./target/release/sawbyte launcher list
          ./target/release/sawbyte launcher create smoke-bot sawbyte-26.3 native
          ./target/release/sawbyte launcher set-setting smoke-bot fov 90
          ./target/release/sawbyte launcher backup smoke-bot
          ./target/release/sawbyte launcher rollback smoke-bot 1
          ./target/release/sawbyte benchmark
          SAWBYTE_BIN=./target/release/sawbyte python sdks/python/tests/test_sdk.py
      - name: Package preview
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/sawbyte.exe dist/
          else
            cp target/release/sawbyte dist/
          fi
          cp README.md LICENSE docs/COVERAGE.md dist/
          cp assets/sawbyte.png dist/sawbyte.png
          cp packaging/generated/sawbyte.ico packaging/generated/sawbyte.icns dist/
          if [ "$RUNNER_OS" = "Linux" ]; then cp packaging/sawbyte.desktop dist/; fi
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file())
          (root / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files
          ))
          PY
      - name: Upload preview binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sawbyte-${{ matrix.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
